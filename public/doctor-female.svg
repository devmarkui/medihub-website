<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgDocF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6f7fb"/>
      <stop offset="100%" stop-color="#cdeef6"/>
    </linearGradient>
    <linearGradient id="silDocF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a7a96"/>
      <stop offset="100%" stop-color="#0d6f87"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgDocF)"/>
  <g opacity="0.08" fill="#0a7a96">
    <circle cx="120" cy="120" r="120"/>
    <circle cx="680" cy="680" r="160"/>
  </g>
  <g transform="translate(400 420)">
    <!-- Head -->
    <circle cx="0" cy="-160" r="135" fill="url(#silDocF)"/>
    <!-- Hair sides extending down to shoulders -->
    <path d="M -135 -180
             C -150 -90, -150 -20, -130 30
             L -90 40
             C -110 -10, -110 -90, -100 -160 Z" fill="url(#silDocF)"/>
    <path d="M 135 -180
             C 150 -90, 150 -20, 130 30
             L 90 40
             C 110 -10, 110 -90, 100 -160 Z" fill="url(#silDocF)"/>
    <!-- Neck -->
    <rect x="-34" y="-30" width="68" height="35" fill="url(#silDocF)"/>
    <!-- Shoulders / coat -->
    <path d="M -300 380
             C -300 180, -180 40, 0 40
             C 180 40, 300 180, 300 380 Z" fill="url(#silDocF)"/>
    <!-- V-neck opening (white) -->
    <path d="M -55 50 L 0 170 L 55 50 L 35 30 L 0 100 L -35 30 Z" fill="#ffffff"/>
    <!-- Inner v-neck triangle accent -->
    <path d="M -22 80 L 0 150 L 22 80 Z" fill="url(#silDocF)" opacity="0.25"/>
    <!-- Stethoscope tubes -->
    <path d="M -90 80 C -150 160, -180 240, -150 320" stroke="#ffffff" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 90 80 C 150 160, 180 240, 150 320" stroke="#ffffff" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- Stethoscope earpieces -->
    <circle cx="-90" cy="76" r="10" fill="#ffffff"/>
    <circle cx="90" cy="76" r="10" fill="#ffffff"/>
    <!-- Stethoscope chest piece (left) -->
    <circle cx="-150" cy="330" r="26" fill="#ffffff"/>
    <circle cx="-150" cy="330" r="14" fill="url(#silDocF)"/>
    <!-- Stethoscope chest piece (right) -->
    <circle cx="150" cy="330" r="26" fill="#ffffff"/>
    <circle cx="150" cy="330" r="14" fill="url(#silDocF)"/>
  </g>
</svg>
